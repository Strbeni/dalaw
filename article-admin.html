<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Publication Manager || Dhwaj &amp; Associates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.png">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f4f1ec; color:#1f2839; min-height:100vh; }
        .admin-header { background:linear-gradient(135deg,#1f2839 0%,#2d3a4f 100%); padding:20px 30px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 20px rgba(0,0,0,.2); }
        .admin-header h1 { color:#fff; font-family:'Playfair Display',serif; font-size:22px; }
        .admin-header h1 i { color:#b69d74; margin-right:10px; }
        .admin-header .header-actions { display:flex; gap:10px; align-items:center; }
        .admin-header .header-actions a { color:#b69d74; text-decoration:none; font-size:14px; font-weight:500; padding:8px 18px; border:1px solid #b69d74; border-radius:50px; transition:all .3s; }
        .admin-header .header-actions a:hover { background:#b69d74; color:#fff; }
        .admin-container { max-width:1100px; margin:30px auto; padding:0 20px; }

        /* Article List */
        .article-list-section { margin-bottom:30px; }
        .section-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .section-bar h2 { font-family:'Playfair Display',serif; font-size:20px; }
        .btn-add { background:#b69d74; color:#fff; border:none; padding:10px 24px; border-radius:50px; font-size:14px; font-weight:600; cursor:pointer; transition:all .3s; font-family:'Inter',sans-serif; }
        .btn-add:hover { background:#a08960; transform:translateY(-1px); box-shadow:0 4px 12px rgba(182,157,116,.4); }
        .article-card { background:#fff; border-radius:12px; padding:18px 22px; margin-bottom:12px; display:flex; align-items:center; gap:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); transition:all .3s; }
        .article-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.1); transform:translateY(-1px); }
        .article-card img { width:80px; height:56px; object-fit:cover; border-radius:8px; flex-shrink:0; }
        .article-card .card-info { flex:1; min-width:0; }
        .article-card .card-info h4 { font-family:'Playfair Display',serif; font-size:15px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .article-card .card-info .meta { font-size:12px; color:#888; }
        .article-card .card-info .meta .badge-cat { display:inline-block; padding:2px 10px; background:#e8e0d3; border-radius:50px; font-size:11px; color:#1f2839; font-weight:600; margin-right:6px; }
        .article-card .card-actions button { border:none; background:none; cursor:pointer; padding:6px 10px; font-size:13px; border-radius:6px; transition:all .2s; margin-left:4px; }
        .article-card .card-actions .btn-edit { color:#b69d74; }
        .article-card .card-actions .btn-edit:hover { background:#f5f0e8; }
        .article-card .card-actions .btn-del { color:#d9534f; }
        .article-card .card-actions .btn-del:hover { background:#fde8e8; }
        .article-card .card-actions .btn-view { color:#1f2839; }
        .article-card .card-actions .btn-view:hover { background:#eee; }
        .empty-state { text-align:center; padding:50px 20px; color:#aaa; }
        .empty-state i { font-size:40px; display:block; margin-bottom:10px; }

        /* Form */
        .form-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; overflow-y:auto; }
        .form-overlay.active { display:block; }
        .form-panel { background:#fff; max-width:900px; margin:30px auto; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,.15); overflow:hidden; }
        .form-panel-header { background:linear-gradient(135deg,#1f2839,#2d3a4f); padding:20px 28px; display:flex; justify-content:space-between; align-items:center; }
        .form-panel-header h3 { color:#fff; font-family:'Playfair Display',serif; font-size:18px; }
        .form-panel-header .btn-close-panel { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; opacity:.7; transition:opacity .2s; }
        .form-panel-header .btn-close-panel:hover { opacity:1; }
        .form-body { padding:28px; }
        .form-row { display:flex; gap:16px; margin-bottom:18px; }
        .form-row .form-group { flex:1; }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#555; text-transform:uppercase; letter-spacing:.5px; }
        .form-group input, .form-group select { width:100%; padding:10px 14px; border:2px solid #e0d6c8; border-radius:8px; font-size:14px; font-family:'Inter',sans-serif; outline:none; transition:border-color .3s; }
        .form-group input:focus, .form-group select:focus { border-color:#b69d74; }

        /* Language Tabs */
        .lang-tabs { display:flex; gap:0; margin-bottom:18px; border-bottom:2px solid #e0d6c8; }
        .lang-tabs button { border:none; background:none; padding:10px 24px; font-size:14px; font-weight:600; cursor:pointer; color:#888; border-bottom:3px solid transparent; margin-bottom:-2px; transition:all .2s; font-family:'Inter',sans-serif; }
        .lang-tabs button.active { color:#b69d74; border-bottom-color:#b69d74; }
        .lang-content { display:none; }
        .lang-content.active { display:block; }

        /* Quill overrides */
        .ql-container { min-height:250px; font-size:15px; }
        .ql-toolbar { border-radius:8px 8px 0 0; border-color:#e0d6c8 !important; }
        .ql-container { border-radius:0 0 8px 8px; border-color:#e0d6c8 !important; }

        .form-footer { padding:16px 28px 24px; display:flex; justify-content:flex-end; gap:10px; border-top:1px solid #eee; }
        .form-footer button { padding:10px 28px; border-radius:50px; font-size:14px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; transition:all .3s; }
        .btn-save { background:#b69d74; color:#fff; border:none; }
        .btn-save:hover { background:#a08960; }
        .btn-cancel { background:none; border:2px solid #ccc; color:#666; }
        .btn-cancel:hover { border-color:#999; color:#333; }

        /* Image preview */
        .img-preview { margin-top:8px; max-width:200px; max-height:120px; border-radius:8px; display:none; }
        .img-preview.visible { display:block; }

        /* Toast */
        .toast-msg { position:fixed; bottom:30px; right:30px; background:#1f2839; color:#fff; padding:14px 24px; border-radius:10px; font-size:14px; box-shadow:0 6px 20px rgba(0,0,0,.2); z-index:9999; display:none; animation:toastIn .3s; }
        .toast-msg.show { display:block; }
        @keyframes toastIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

        /* Login Screen */
        .login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#1f2839 0%,#2d3a4f 60%,#3a4d6a 100%); }
        .login-screen.hidden { display:none; }
        .login-card { background:#fff; border-radius:16px; padding:48px 40px; max-width:400px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:center; }
        .login-card img { width:160px; margin-bottom:24px; }
        .login-card h2 { font-family:'Playfair Display',serif; font-size:22px; color:#1f2839; margin-bottom:6px; }
        .login-card .login-sub { font-size:13px; color:#888; margin-bottom:28px; }
        .login-card .login-field { position:relative; margin-bottom:16px; }
        .login-card .login-field input { width:100%; padding:12px 16px 12px 42px; border:2px solid #e0d6c8; border-radius:10px; font-size:14px; font-family:'Inter',sans-serif; outline:none; transition:border-color .3s; }
        .login-card .login-field input:focus { border-color:#b69d74; }
        .login-card .login-field i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#b69d74; font-size:15px; }
        .login-card .login-error { color:#d9534f; font-size:13px; margin-bottom:12px; display:none; }
        .login-card .login-error.show { display:block; }
        .login-card .btn-login { width:100%; padding:12px; background:#b69d74; color:#fff; border:none; border-radius:50px; font-size:15px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; transition:all .3s; }
        .login-card .btn-login:hover { background:#a08960; transform:translateY(-1px); box-shadow:0 4px 16px rgba(182,157,116,.4); }
        .admin-main { display:none; }
        .admin-main.active { display:block; }

        @media(max-width:768px) {
            .form-row { flex-direction:column; gap:0; }
            .admin-header { flex-direction:column; gap:10px; text-align:center; }
            .article-card { flex-direction:column; text-align:center; }
            .article-card img { width:100%; height:120px; }
            .login-card { padding:32px 24px; }
        }
    </style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="login-screen">
    <div class="login-card">
        <img src="images/logo.png" alt="Dhwaj & Associates">
        <h2>Publication Manager</h2>
        <p class="login-sub">Admin access only. Please sign in to continue.</p>
        <div class="login-field">
            <i class="fa fa-envelope"></i>
            <input type="email" id="login-email" placeholder="Email" autocomplete="email">
        </div>
        <div class="login-field">
            <i class="fa fa-lock"></i>
            <input type="password" id="login-password" placeholder="Password">
        </div>
        <p class="login-error" id="login-error">Invalid username or password.</p>
        <button class="btn-login" id="btn-login">Sign In</button>
    </div>
</div>

<!-- Admin Content (hidden until login) -->
<div class="admin-main" id="admin-main">
<header class="admin-header">
    <h1><i class="fa fa-pencil-square-o"></i> Publication Manager</h1>
    <div class="header-actions">
        <a href="articles.html"><i class="fa fa-arrow-left"></i> View Publications</a>
        <a href="index.html"><i class="fa fa-home"></i> Home</a>
        <a href="#" id="btn-logout" style="border-color:#d9534f;color:#d9534f;"><i class="fa fa-sign-out"></i> Logout</a>
    </div>
</header>

<div class="admin-container">
    <div class="article-list-section">
        <div class="section-bar">
            <h2>All Publications</h2>
            <button class="btn-add" id="btn-add-new"><i class="fa fa-plus"></i> Add New Publication</button>
        </div>
        <div id="article-list"></div>
    </div>
</div>

<!-- Form Overlay -->
<div class="form-overlay" id="form-overlay">
    <div class="form-panel">
        <div class="form-panel-header">
            <h3 id="form-title">Add New Publication</h3>
            <button class="btn-close-panel" id="btn-close-form">&times;</button>
        </div>
        <div class="form-body">
            <input type="hidden" id="edit-id" value="">
            <div class="form-row">
                <div class="form-group">
                    <label>Category</label>
                    <select id="field-category">
                        <option value="default">Default</option>
                        <option value="indo-japan">Indo Japan Corridor</option>
                        <option value="indo-us">Indo US Corridor</option>
                        <option value="indo-europe">Indo Europe Corridor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="field-date">
                </div>
                <div class="form-group">
                    <label>Author</label>
                    <input type="text" id="field-author" value="Admin">
                </div>
            </div>
            <div class="form-group">
                <label>Image URL / Path</label>
                <input type="text" id="field-image" placeholder="e.g. images/article/MyImage.jpg or https://...">
                <img class="img-preview" id="img-preview" alt="Preview">
            </div>

            <!-- Language Tabs -->
            <div class="lang-tabs">
                <button class="active" data-lang="en">🇬🇧 English</button>
                <button data-lang="jp">🇯🇵 Japanese</button>
            </div>

            <!-- English Content -->
            <div class="lang-content active" id="lang-en">
                <div class="form-group">
                    <label>Title (English)</label>
                    <input type="text" id="field-title-en" placeholder="Article title in English">
                </div>
                <div class="form-group">
                    <label>Short Description (English)</label>
                    <input type="text" id="field-desc-en" placeholder="Brief description for the article card">
                </div>
                <div class="form-group">
                    <label>Publication Body (English)</label>
                    <div id="editor-en"></div>
                </div>
            </div>

            <!-- Japanese Content -->
            <div class="lang-content" id="lang-jp">
                <div class="form-group">
                    <label>タイトル (Japanese)</label>
                    <input type="text" id="field-title-jp" placeholder="日本語のタイトル">
                </div>
                <div class="form-group">
                    <label>簡単な説明 (Japanese)</label>
                    <input type="text" id="field-desc-jp" placeholder="記事カードの簡単な説明">
                </div>
                <div class="form-group">
                    <label>記事本文 (Japanese)</label>
                    <div id="editor-jp"></div>
                </div>
            </div>
        </div>
        <div class="form-footer">
            <button class="btn-cancel" id="btn-form-cancel">Cancel</button>
            <button class="btn-save" id="btn-form-save"><i class="fa fa-check"></i> Save Publication</button>
        </div>
    </div>
</div>

<div class="toast-msg" id="toast"></div>
</div><!-- /admin-main -->

<script src="js/jquery.min.js"></script>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/articles-data.js"></script>
<script>
(function($){
    'use strict';

    var supabase = ArticlesStore.supabase;

    // Check existing session
    if (supabase) {
        supabase.auth.getSession().then(function(res) {
            if (res.data.session) {
                showAdmin();
            }
        });
    }

    // Login handler
    $('#btn-login').on('click', doLogin);
    $('#login-password').on('keypress', function(e) { if (e.which === 13) doLogin(); });
    $('#login-email').on('keypress', function(e) { if (e.which === 13) $('#login-password').focus(); });

    function doLogin() {
        var email = $('#login-email').val().trim();
        var pass = $('#login-password').val();
        if (!email || !pass) {
            $('#login-error').text('Please enter email and password.').addClass('show');
            return;
        }
        $('#btn-login').text('Signing in...').prop('disabled', true);
        $('#login-error').removeClass('show');

        supabase.auth.signInWithPassword({ email: email, password: pass })
            .then(function(res) {
                if (res.error) {
                    $('#login-error').text(res.error.message).addClass('show');
                    $('#login-password').val('').focus();
                    $('#btn-login').text('Sign In').prop('disabled', false);
                } else {
                    showAdmin();
                }
            });
    }

    function showAdmin() {
        $('#login-screen').addClass('hidden');
        $('#admin-main').addClass('active');
        initAdmin();
    }

    // Logout
    $('#btn-logout').on('click', function(e) {
        e.preventDefault();
        supabase.auth.signOut().then(function() {
            location.reload();
        });
    });

    function initAdmin() {

    var quillEn, quillJp, editingId = null;
    var toolbarOptions = [
        [{ header: [1, 2, 3, false] }],
        ['bold', 'italic', 'underline'],
        ['link', 'image'],
        [{ list: 'ordered'}, { list: 'bullet' }],
        ['blockquote'],
        ['clean']
    ];

    quillEn = new Quill('#editor-en', { theme:'snow', modules:{ toolbar: toolbarOptions }, placeholder:'Write your publication content here...' });
    quillJp = new Quill('#editor-jp', { theme:'snow', modules:{ toolbar: toolbarOptions }, placeholder:'ここに記事の内容を書いてください...' });

    async function renderList() {
        var articles = await ArticlesStore.getAll();
        var $list = $('#article-list');
        $list.empty();
        if (!articles.length) {
            $list.html('<div class="empty-state"><i class="fa fa-file-text-o"></i>No publications yet. Click "Add New Publication" to create one.</div>');
            return;
        }
        articles.forEach(function(a) {
            var en = a.content.en || {};
            var catName = ArticlesStore.getCategoryName(a.category, 'en');
            var dateStr = ArticlesStore.formatDate(a.date, 'en');
            var imgSrc = a.image || 'images/favicon.png';
            var slug = (en.title || '').toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
            var viewUrl = a.legacySlug ? a.legacySlug : 'article-view.html?id=' + a.id + '&title=' + slug;
            var card = '<div class="article-card" data-id="'+a.id+'">' +
                '<img src="'+imgSrc+'" alt="">' +
                '<div class="card-info"><h4>'+( en.title || 'Untitled')+'</h4>' +
                '<div class="meta"><span class="badge-cat">'+catName+'</span> '+dateStr+' &middot; '+(a.author||'Admin')+'</div></div>' +
                '<div class="card-actions">' +
                '<button class="btn-view" title="View" onclick="window.open(\''+viewUrl+'\',\'_blank\')"><i class="fa fa-eye"></i></button>' +
                '<button class="btn-edit" title="Edit" data-id="'+a.id+'"><i class="fa fa-pencil"></i></button>' +
                '<button class="btn-del" title="Delete" data-id="'+a.id+'"><i class="fa fa-trash"></i></button>' +
                '</div></div>';
            $list.append(card);
        });
    }

    function openForm(article) {
        editingId = article ? article.id : null;
        $('#form-title').text(article ? 'Edit Publication' : 'Add New Publication');
        $('#edit-id').val(editingId || '');
        $('#field-category').val(article ? article.category : 'default');
        $('#field-date').val(article ? article.date : new Date().toISOString().split('T')[0]);
        $('#field-author').val(article ? (article.author||'Admin') : 'Admin');
        $('#field-image').val(article ? (article.image||'') : '');
        updateImgPreview();
        var en = article ? (article.content.en||{}) : {};
        var jp = article ? (article.content.jp||{}) : {};
        $('#field-title-en').val(en.title||'');
        $('#field-desc-en').val(en.description||'');
        quillEn.root.innerHTML = en.body||'';
        $('#field-title-jp').val(jp.title||'');
        $('#field-desc-jp').val(jp.description||'');
        quillJp.root.innerHTML = jp.body||'';
        $('.lang-tabs button').removeClass('active').first().addClass('active');
        $('.lang-content').removeClass('active').first().addClass('active');
        $('#form-overlay').addClass('active');
    }

    function closeForm() { $('#form-overlay').removeClass('active'); editingId = null; }

    async function saveArticle() {
        var titleEn = $('#field-title-en').val().trim();
        if (!titleEn) { showToast('Please enter an English title.'); return; }
        $('#btn-form-save').text('Saving...').prop('disabled', true);
        var article = {
            id: editingId || ('article-' + Date.now()),
            category: $('#field-category').val(),
            image: $('#field-image').val().trim(),
            date: $('#field-date').val(),
            author: $('#field-author').val().trim() || 'Admin',
            content: {
                en: { title: titleEn, description: $('#field-desc-en').val().trim(), body: quillEn.root.innerHTML },
                jp: { title: $('#field-title-jp').val().trim(), description: $('#field-desc-jp').val().trim(), body: quillJp.root.innerHTML }
            }
        };
        if (editingId) {
            await ArticlesStore.updateArticle(editingId, article);
            showToast('Publication updated successfully!');
        } else {
            await ArticlesStore.addArticle(article);
            showToast('Publication added successfully!');
        }
        $('#btn-form-save').text('Save Publication').prop('disabled', false);
        closeForm();
        await renderList();
    }

    function updateImgPreview() {
        var v = $('#field-image').val().trim();
        if (v) { $('#img-preview').attr('src',v).addClass('visible'); }
        else { $('#img-preview').removeClass('visible'); }
    }

    function showToast(msg) {
        var $t = $('#toast');
        $t.text(msg).addClass('show');
        setTimeout(function(){ $t.removeClass('show'); }, 2500);
    }

    // Events
    $('#btn-add-new').on('click', function(){ openForm(null); });
    $('#btn-close-form, #btn-form-cancel').on('click', closeForm);
    $('#btn-form-save').on('click', saveArticle);
    $('#field-image').on('input', updateImgPreview);
    $('.lang-tabs').on('click','button', function(){
        $('.lang-tabs button').removeClass('active'); $(this).addClass('active');
        $('.lang-content').removeClass('active');
        $('#lang-'+$(this).data('lang')).addClass('active');
    });
    $(document).on('click','.btn-edit', async function(){
        var a = await ArticlesStore.getById($(this).data('id'));
        if(a) openForm(a);
    });
    $(document).on('click','.btn-del', async function(){
        if(confirm('Are you sure you want to delete this publication?')){
            await ArticlesStore.deleteArticle($(this).data('id'));
            await renderList();
            showToast('Publication deleted.');
        }
    });
    $('#form-overlay').on('click', function(e){ if(e.target===this) closeForm(); });

    renderList();
    } // end initAdmin
})(jQuery);
</script>
</body>
</html>
